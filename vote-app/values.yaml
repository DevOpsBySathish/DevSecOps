# Default values for vote-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

vote:
  name: vote
  replicaCount: 1
  image:
    repository: acrvoteappdemo.azurecr.io/vote-app
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8080
    targetPort: 80
    nodePort: 31000

result:
  name: result
  replicaCount: 1
  image:
    repository: acrvoteappdemo.azurecr.io/result-app
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8081
    targetPort: 80
    nodePort: 31001

worker:
  name: worker
  replicaCount: 1
  image:
    repository: acrvoteappdemo.azurecr.io/worker-backend
    tag: latest
    pullPolicy: IfNotPresent

db:
  name: db
  replicaCount: 1
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  service:
    port: 5432
    targetPort: 5432
  env:
    user: postgres
    password: postgres

redis:
  name: redis
  replicaCount: 1
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    port: 6379
    targetPort: 6379