apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.db.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vote-app.db.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.db.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.db.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.db.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
        imagePullPolicy: {{ .Values.db.image.pullPolicy }}
        name: postgres
        env:
        - name: POSTGRES_USER
          value: {{ .Values.db.env.user }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.db.env.password }}
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: db-data
      volumes:
      - name: db-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.db.name }}
  labels:
    {{- include "vote-app.db.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: "db-service"
    port: {{ .Values.db.service.port }}
    targetPort: {{ .Values.db.service.targetPort }}
  selector:
    app.kubernetes.io/name: {{ .Values.db.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}